<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bienvenido</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
        .welcome-card { display: inline-block; padding: 2rem; border: 1px solid #ddd; border-radius: 8px; background: #fff; }
        a { display: inline-block; margin-top: 1rem; color: #007bff; text-decoration: none; }
    </style>
</head>
<body>
    <div class="welcome-card">
        <h1>¡Bienvenido, <span th:text="${usuario.nombre}">Usuario</span>!</h1>
        <p>Has iniciado sesión correctamente.</p>
        <a href="/">Cerrar Sesión</a>
    </div>
</body>
</html>
