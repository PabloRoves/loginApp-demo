<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bienvenido</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
        .welcome-card { display: inline-block; padding: 2rem; border: 1px solid #ddd; border-radius: 8px; background: #fff; }
        button { margin-top: 1rem; padding: 0.5rem 1rem; background-color: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="welcome-card">
        <h1>¡Bienvenido, <span th:text="${usuario != null ? usuario.nombre : 'Usuario'}">Usuario</span>!</h1>
        <p>Has iniciado sesión correctamente.</p>
        <form th:action="@{/logout}" method="post">
            <button type="submit">Cerrar Sesión</button>
        </form>
    </div>
</body>
</html>
